<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- SU700 top-down: slate body, VFD display with track meters, knob row, pads. -->
  <clipPath id="body"><rect x="1" y="1.5" width="30" height="29" rx="3"/></clipPath>
  <rect x="1" y="1.5" width="30" height="29" rx="3" fill="#40465a"/>
  <!-- lighter sloped front section, clipped to the rounded body -->
  <rect x="1" y="19" width="30" height="12" fill="#484e63" clip-path="url(#body)"/>
  <!-- display -->
  <rect x="5" y="4.5" width="22" height="9" rx="1" fill="#05090d"/>
  <g>
    <rect x="7"    y="9"   width="1.8" height="3"   fill="#ffae3d"/>
    <rect x="9.6"  y="7.5" width="1.8" height="4.5" fill="#ffae3d"/>
    <rect x="12.2" y="8"   width="1.8" height="4"   fill="#dcfff8"/>
    <rect x="14.8" y="6.5" width="1.8" height="5.5" fill="#dcfff8"/>
    <rect x="17.4" y="8.5" width="1.8" height="3.5" fill="#6aa4ff"/>
    <rect x="20"   y="7"   width="1.8" height="5"   fill="#6aa4ff"/>
    <rect x="22.6" y="9.5" width="1.8" height="2.5" fill="#ff4e4e"/>
  </g>
  <!-- knobs -->
  <g>
    <circle cx="6"  cy="16.4" r="1.3" fill="#ef9149"/>
    <circle cx="10" cy="16.4" r="1.3" fill="#e9e3cf"/>
    <circle cx="14" cy="16.4" r="1.3" fill="#e9e3cf"/>
    <circle cx="18" cy="16.4" r="1.3" fill="#a6aac2"/>
    <circle cx="22" cy="16.4" r="1.3" fill="#a6aac2"/>
    <circle cx="26" cy="16.4" r="1.3" fill="#e14a42"/>
  </g>
  <!-- pads: short LOOP / AUDIO IN / MASTER, taller COMPOSED LOOP and FREE -->
  <g>
    <rect x="3.5"  y="22.5" width="3.6" height="4.5" rx=".6" fill="#f29c52"/>
    <rect x="7.9"  y="21"   width="3.6" height="6"   rx=".6" fill="#c9cacd"/>
    <rect x="12.3" y="21"   width="3.6" height="6"   rx=".6" fill="#c9cacd"/>
    <rect x="16.7" y="21"   width="3.6" height="6"   rx=".6" fill="#8e93c3"/>
    <rect x="21.1" y="21"   width="3.6" height="6"   rx=".6" fill="#8e93c3"/>
    <rect x="25.5" y="22.5" width="3.6" height="4.5" rx=".6" fill="#e85a58"/>
  </g>
</svg>
