# Builds the Angular app and publishes it to GitHub Pages at https://<user>.github.io/su700/.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx ng build --configuration production --base-href /su700/
      # Pages has no SPA rewrites: serve the app for unknown paths too.
      - run: cp dist/su700/browser/index.html dist/su700/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/su700/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
